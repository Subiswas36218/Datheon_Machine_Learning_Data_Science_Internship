name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install nbconvert

      - name: Run pipeline tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v

      - name: Execute final documented notebook
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/iris_classification_final_detailed.ipynb \
            --output executed-final-notebook.ipynb \
            --ExecutePreprocessor.timeout=600

      - name: Upload generated outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-pipeline-artifacts-py${{ matrix.python-version }}
          path: |
            outputs/
            executed-final-notebook.ipynb
          if-no-files-found: ignore