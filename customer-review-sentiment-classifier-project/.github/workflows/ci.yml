name: Sentiment NLP CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-notebook:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download NLTK resources
        run: |
          python -m nltk.downloader stopwords wordnet omw-1.4
      - name: Run automated tests
        run: python -m unittest discover -s tests -v
      - name: Run training pipeline
        run: python src/train.py
      - name: Execute notebook
        run: |
          jupyter nbconvert --to notebook --execute \
            notebooks/customer_review_sentiment_classification.ipynb \
            --output executed_notebook.ipynb --output-dir outputs --ExecutePreprocessor.timeout=600
      - name: Upload reports and executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentiment-nlp-artifacts-python-${{ matrix.python-version }}
          path: |
            outputs/
            models/
          if-no-files-found: warn
