name: Churn Classifier CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-notebook:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -q

      - name: Execute analysis notebook
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute notebooks/customer_churn_classification.ipynb \
            --output customer_churn_classification.executed.ipynb \
            --output-dir outputs \
            --ExecutePreprocessor.timeout=900

      - name: Upload notebook and plots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: churn-analysis-python-${{ matrix.python-version }}
          path: |
            outputs/figures/*.png
            outputs/*.csv
            outputs/*.json
            outputs/customer_churn_classification.executed.ipynb
          if-no-files-found: warn
