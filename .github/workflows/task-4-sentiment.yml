name: Task 4 - Customer Review Sentiment CI

on:
  push:
    branches: [main, master]
    paths:
      - 'customer-review-sentiment-classifier-project/**'
      - '.github/workflows/task-4-sentiment.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'customer-review-sentiment-classifier-project/**'
      - '.github/workflows/task-4-sentiment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-4-sentiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-train-and-notebook:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: customer-review-sentiment-classifier-project
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: customer-review-sentiment-classifier-project/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Download NLTK corpora
        run: python -m nltk.downloader stopwords wordnet omw-1.4
      - name: Run unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
      - name: Train and export model pipelines
        run: python src/train.py
      - name: Execute sentiment notebook
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert --to notebook --execute notebooks/customer_review_sentiment_classification.ipynb \
            --output sentiment_ci.ipynb --output-dir outputs/ci --ExecutePreprocessor.timeout=900
      - name: Upload task artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-4-sentiment-python-${{ matrix.python-version }}
          path: |
            customer-review-sentiment-classifier-project/outputs/
            customer-review-sentiment-classifier-project/models/
          if-no-files-found: warn
          retention-days: 14
