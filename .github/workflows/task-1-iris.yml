name: Task 1 - Iris Classification CI

on:
  push:
    branches: [main, master]
    paths:
      - 'iris-classification-pipeline/**'
      - '.github/workflows/task-1-iris.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'iris-classification-pipeline/**'
      - '.github/workflows/task-1-iris.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-1-iris-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-notebook:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: iris-classification-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: iris-classification-pipeline/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
      - name: Execute detailed notebook
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert --to notebook --execute notebooks/iris_classification.ipynb \
            --output iris_classification_ci.ipynb --output-dir outputs/ci --ExecutePreprocessor.timeout=600
      - name: Upload task artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-1-iris-python-${{ matrix.python-version }}
          path: |
            iris-classification-pipeline/outputs/
          if-no-files-found: warn
          retention-days: 14