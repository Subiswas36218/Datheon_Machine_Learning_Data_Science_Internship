name: Task 2 - California Housing Regression CI

on:
  push:
    branches: [main, master]
    paths:
      - 'california-housing-ridge-lasso/**'
      - '.github/workflows/task-2-housing.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'california-housing-ridge-lasso/**'
      - '.github/workflows/task-2-housing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-2-housing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-notebook:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: california-housing-ridge-lasso
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: california-housing-ridge-lasso/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run unit and integration tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests -v
      - name: Execute regression notebook
        env:
          MPLBACKEND: Agg
        run: |
          jupyter nbconvert --to notebook --execute notebooks/real_estate_housing_price_prediction.ipynb \
            --output housing_regression_ci.ipynb --output-dir outputs/ci --ExecutePreprocessor.timeout=900
      - name: Upload task artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-2-housing-python-${{ matrix.python-version }}
          path: |
            california-housing-ridge-lasso/outputs/
          if-no-files-found: warn
          retention-days: 14